[package]
name = "r8cpu"
version = "0.1.0"
edition = "2024"
authors = ["John Arundel <john@bitfieldconsulting.com>"]
description = """An emulator for the R8 teaching CPU."""
keywords = []
categories = []
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/r8cpu"
homepage = "https://github.com/bitfield/r8"
repository = "https://github.com/bitfield/r8"
exclude = ["/.github/"]

[badges]
github = { repository = "bitfield/r8", workflow = "CI" }
maintenance = { status = "actively-developed" }

[profile.release]

[dependencies]
anyhow = "1.0.102"
rand = { version = "0.10.1", features = ["thread_rng"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }
blanket_clippy_restriction_lints = "allow"
print_stdout = "allow"
pub_use = "allow"
question_mark_used = "allow"
implicit_return = "allow"
missing_docs_in_private_items = "allow" # TODO: remove for release
